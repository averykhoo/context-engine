# The gate (CLAUDE.md § Gate) on every push, on a clean checkout at the declared Python floor (CE-10).
# tests/test_ci.py pins this file to pyproject.toml and to the gate command.
# No `paths:` filter: docs/, tasks/ and context.toml are records that lint checks (AC-23), so a
# docs-only push can turn the gate red.
name: gate

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: lint's G-W9 and G-W11 read git history, and a shallow clone makes G-W9
          # trust a cited commit it lacks and G-W11 skip (tests/test_ci.py pins this).
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Gate
        run: python -m pytest -q
