# context-engine's own framework config (FRAMEWORK §8.0). The engine reads this and writes the
# records below through its operations; `context-engine routes` prints the routing table.

[engine]
oplog = "docs/ledger/ops.jsonl"     # one JSON line per engine write (AC-6)
lockfile = ".context/engine.lock"   # .context/ carries its own `.gitignore`; never tracked
bundles = ["docs/decisions", "docs/stories", "tasks"]
contract = "CLAUDE.md"              # its `framework:` line must equal the engine's major.minor (lint G-D0, DEC-23)

[kinds.decision]
type = "Decision"
prefix = "DEC"
dir = "docs/decisions"
mode = "append-only"
required = ["title", "actor", "decided", "session", "decision_status"]
enums = { decision_status = ["BUILT", "PROVISIONAL", "DEFERRED", "SUPERSEDED", "REJECTED"] }  # FRAMEWORK §6.5
types = { aliases = "list", decided = "date", session = "key", tags = "list", supersedes = "list", superseded_by = "list", relaxes = "list", narrowed_by = "list", creates = "list", amends = "list", retires = "list", tasks = "list", code = "list", refs = "list" }  # link fields: FRAMEWORK §6.5

[kinds.story]
type = "Story"
prefix = "US"
dir = "docs/stories"
mode = "append-only"
required = ["title", "actor", "date", "story_status", "goals"]
enums = { story_status = ["live", "unspecified", "unconfirmed", "retired"] }  # FRAMEWORK §3.2
types = { aliases = "list", date = "date", goals = "list", supersedes = "list", superseded_by = "list" }  # the links only `record retire` writes

[kinds.task]
type = "Task"
prefix = "CE"
dir = "tasks"
mode = "replaced"
required = ["title", "pri", "state", "created"]
enums = { pri = ["NOW", "NEXT", "LATER", "SOMEDAY"], state = ["open", "closed"] }
types = { aliases = "list", created = "date", moved = "key", updated = "key", closed = "key", deps = "list", labels = "list", review = "list" }

[kinds.question]
type = "Question"
prefix = "ASK"
dir = "tasks"
mode = "replaced"
required = ["title", "pri", "state", "created"]
enums = { pri = ["NOW", "NEXT", "LATER", "SOMEDAY"], state = ["open", "closed"] }
types = { aliases = "list", created = "date", moved = "key", updated = "key", closed = "key", deps = "list", labels = "list", blocks = "list", last_asked = "key", review = "list" }

# Batons and pause records: one session-stamped record each (FRAMEWORK §5.4, §8.0.1; DEC-14).
[kinds.baton]
type = "Baton"
prefix = "BTN"
dir = "docs/working"
mode = "stamped"
required = ["title", "session", "state", "created"]
enums = { state = ["open", "done", "expired"] }
types = { session = "key", created = "date", done = "key" }

[kinds.pause]
type = "Pause"
prefix = "PAU"
dir = "docs/working"
mode = "stamped"
required = ["title", "session", "state", "created", "branch", "resume_step"]
enums = { state = ["open", "done", "expired"] }
types = { session = "key", created = "date", resumed = "key", uncommitted = "list", deferred = "list" }

# Working state (FRAMEWORK §5): which files and kinds the session operations use.
[working]
ledger = "docs/ledger/session-log.md"   # one file under the lock (Q-H, DEC-14)
handoff = "HANDOFF.md"
board = ["task", "question"]
task = "task"
question = "question"
decision = "decision"
baton = "baton"
pause = "pause"
orient_max_bytes = 6000                  # provenance: JUDGEMENT, DEC-14 (one screen of orient); wrong if a routine orient gets cut
read_max_bytes = 6000                    # provenance: JUDGEMENT, CE-3: the orient cap (DEC-14) for every MCP read; wrong if a routine read (one task, the board) gets cut
register = "src/context_engine/REGISTER.md"  # the engine's residual-risk register; package data, so it ships with the engine (CE-23)
decision_index = "docs/decisions/index.md"   # generated from the decisions' frontmatter on every decision write; lint G-D6 checks it
criteria = "docs/criteria.md"               # `decision link` checks a criterion id is a row here
archive = "docs/archive"                    # `doc archive` with no --to (FRAMEWORK §7.3, CE-27); none archived yet
review_triggers = ["record-kind", "guard", "write-op", "git-loss", "long-lived", "shipped"]  # FRAMEWORK §5.2's threshold, one value per clause

# The scoped gate (FRAMEWORK §8.5 G-V1, CE-78): `context-engine gate run` runs the gate and records
# its result against each scope's content id; `context-engine commit` refuses a path in `require`'s
# scope until a green run covers the scope's id. `gate status` says what is covered.
[gate]
command = ["{python}", "-m", "pytest", "-q"]   # CLAUDE.md § Gate; tests/test_ci.py keeps CI on the same command
require = "code"

# The code scope: every file but the records and the prose that only the lint test, and the readers
# below, read. MEASURED 2026-10-14g by an audit-hook census of the whole suite (every file each test
# opened, listed or started a process in); tests/conftest.py's scope guard fails any other test
# that touches an excluded path, so a new reader cannot slip in unseen. The readers are re-run on
# every file (`gate run --readers`): the lint test, the OKF byte round-trip over every record, an
# orient of this repo, the "ritual" sweep, which reads HANDOFF.md, and the plugin launcher's LF check,
# whose `git check-attr` runs in the repo (CE-77).
[gate.scopes.code]
exclude = ["tasks/**", "docs/decisions/**", "docs/stories/**", "docs/ledger/**", "docs/working/**", "docs/evidence/**", "spike/**", "HANDOFF.md", "README.md", "docs/charter.md", "docs/criteria.md"]
readers = [
    "tests/test_repo_records.py::test_this_repos_records_pass_lint",
    "tests/test_okf.py::test_every_record_in_this_repo_round_trips_byte_identical",
    "tests/test_review.py::test_orient_points_at_the_engine_register_in_a_foreign_repo_only",
    "tests/test_kit.py::test_no_living_framework_text_says_ritual",
    "tests/test_plugin.py::test_the_launcher_keeps_lf_line_endings_on_every_checkout",  # git check-attr in the repo (CE-77)
]

[gate.scopes.all]   # every file: a green run here is the whole gate on exactly this tree

# Where each framework component lives (FRAMEWORK §2). Moved here from CLAUDE.md in CE-8; print it
# with `context-engine routes`. G-R1 fails lint if a path stops existing. `mode` is how the component changes.
[[routes]]
component = "Spec"
path = "docs/framework/FRAMEWORK.md"
mode = "replaced in place; no change log, the why is in decisions and stories (DEC-26)"

[[routes]]
component = "Contract"
path = "CLAUDE.md"
mode = "replaced; durable rules only, promoted from HANDOFF (FRAMEWORK §6.7)"
max_lines = 140    # G-D1; provenance: MEASURED 2026-10-12d, 116 lines, plus room for two or three rules; wrong if a rule that belongs here is kept in HANDOFF to stay under it
max_bytes = 10000  # G-D1; provenance: MEASURED 2026-10-12d, 8086 bytes, plus the same room; wrong as above
max_width = 125    # G-D1; provenance: MEASURED 2026-10-12d, widest prose line 121; wrong if wrapping starts to split commands mid-line

[[routes]]
component = "Framework contract"
path = "docs/framework/contract.md"
mode = "the framework's: imported by CLAUDE.md, replaced whole on upgrade, never edited here (G-D0 compares it with the engine's kit)"

[[routes]]
component = "Frozen provenance"
path = "docs/framework"
pattern = "FRAMEWORK-v0.*.md"
mode = "never edited"

[[routes]]
component = "Charter"
path = "docs/charter.md"
mode = "replaced, signed off by the owner"
note = "confirmed 2026-10-08, DEC-10"

[[routes]]
component = "Stories (owner's words)"
path = "docs/stories"
pattern = "US-n-<slug>.md"
mode = "append-only: `context-engine record amend`; retired only by `context-engine record retire`; never rewrite"

[[routes]]
component = "Criteria"
path = "docs/criteria.md"
mode = "replaced, ids kept"
note = "AC-n, claimed by @pytest.mark.criterion(\"AC-n\")"

[[routes]]
component = "Decisions"
path = "docs/decisions"
pattern = "DEC-n-<slug>.md"
mode = "append-only: `context-engine record amend` or `record correct`; links through `context-engine decision supersede|link`"
note = "one record each (FRAMEWORK §6.5); index.md is generated on every decision write (G-D6)"

[[routes]]
component = "Tasks and owner questions"
path = "tasks"
pattern = "CE-n-<slug>.md, ASK-n-<slug>.md"
mode = "frontmatter through `context-engine task`/`context-engine ask`, bodies by hand"

[[routes]]
component = "Orientation note"
path = "HANDOFF.md"
mode = "replaced at clean close; banner through `context-engine banner set`"
max_lines = 130    # G-D1, the byte cap is the backstop to G-D8 (P6); provenance: MEASURED 2026-10-12d, 101 lines, plus about a quarter; wrong if a cold session needs more to orient than fits
max_bytes = 10000  # G-D1; provenance: MEASURED 2026-10-12d, 7723 bytes, plus about a quarter; wrong as above
max_width = 140    # G-D1; provenance: MEASURED 2026-10-12d, widest prose line 136; wrong if wrapping starts to split commands mid-line

[[routes]]
component = "Batons and pause records"
path = "docs/working"
pattern = "<id>-<slug>.md"
mode = "session-stamped, through `context-engine baton`/`context-engine pause`"

[[routes]]
component = "Session ledger"
path = "docs/ledger/session-log.md"
mode = "append-only, one entry per session, through `context-engine session`"

[[routes]]
component = "Residual-risk register"
path = "src/context_engine/REGISTER.md"
mode = "entries appended by `context-engine task close`; an entry is edited only when the code changes"
note = "INV-n; package data, so every repo the engine is pointed at reads it (`context-engine register show --engine`)"

[[routes]]
component = "Operation log"
path = "docs/ledger/ops.jsonl"
mode = "append-only, written by the engine"

[[routes]]
component = "Runbooks"
path = "docs/runbooks"
mode = "replaced only through the kit copy: every file equals src/context_engine/kit/docs/runbooks/ byte for byte (AC-37); AC-21 and AC-36 keep procedures.md and manual-mode.md in step with the CLI and FRAMEWORK §6"
note = "procedures.md: every procedure's steps in order (US-15); manual-mode.md: every engine operation by hand, with its Why (US-11); the method runbooks are routed one by one below (CE-26)"

# The method runbooks (FRAMEWORK §7.5, CE-26): one route each, so G-R1 is red when one goes and
# G-D1 keeps each short. Framework-generic kit copies (AC-71); this repo's values are in CLAUDE.md.
[[routes]]
component = "Gate runbook"
path = "docs/runbooks/gate.md"
mode = "replaced only through the kit copy (AC-37), LIVING"
note = "running the gate so its result is true, and the test baselines"
max_lines = 90     # G-D1; provenance: MEASURED 2026-10-13c, the longest method runbook 70 lines, plus room for a few rows; wrong if a method step is left out to stay under it
max_bytes = 8000   # G-D1; provenance: MEASURED 2026-10-13c, the largest 4897 bytes, plus the same room; wrong as above
max_width = 100    # G-D1; provenance: JUDGEMENT 2026-10-13c, the prose wrap of the other runbooks; wrong if wrapping splits a command mid-line

[[routes]]
component = "Sabotage runbook"
path = "docs/runbooks/sabotage.md"
mode = "replaced only through the kit copy (AC-37), LIVING"
note = "seeing every new check fail before believing it (DEC-11)"
max_lines = 90     # G-D1; provenance: MEASURED 2026-10-13c, as the gate runbook's; wrong as above
max_bytes = 8000   # G-D1; provenance: MEASURED 2026-10-13c, as the gate runbook's; wrong as above
max_width = 100    # G-D1; provenance: MEASURED 2026-10-13c, as the gate runbook's; wrong as above

[[routes]]
component = "Fan-out runbook"
path = "docs/runbooks/fan-out.md"
mode = "replaced only through the kit copy (AC-37), LIVING"
note = "delegation, workflows and FRAMEWORK §6.6's build rounds (DEC-16, DEC-17, DEC-18 are the rules)"
max_lines = 90     # G-D1; provenance: MEASURED 2026-10-13c, as the gate runbook's; wrong as above
max_bytes = 8000   # G-D1; provenance: MEASURED 2026-10-13c, as the gate runbook's; wrong as above
max_width = 100    # G-D1; provenance: MEASURED 2026-10-13c, as the gate runbook's; wrong as above

[[routes]]
component = "Release runbook"
path = "docs/runbooks/release.md"
mode = "replaced only through the kit copy (AC-37), LIVING"
note = "tag, publish, confirm, and the fresh-user install trial"
max_lines = 90     # G-D1; provenance: MEASURED 2026-10-13c, as the gate runbook's; wrong as above
max_bytes = 8000   # G-D1; provenance: MEASURED 2026-10-13c, as the gate runbook's; wrong as above
max_width = 100    # G-D1; provenance: MEASURED 2026-10-13c, as the gate runbook's; wrong as above

[[routes]]
component = "Adoption kit"
path = "src/context_engine/kit"
mode = "replaced; package data, so it ships with the engine; tests/test_kit.py keeps it in step with config.py and FRAMEWORK §6.6"
note = "what `context-engine init` copies into a repo (FRAMEWORK §6.9); README.md there is the install, bootstrap and upgrade guide"

[[routes]]
component = "Claude Code plugin"
path = "plugin"
mode = "replaced; the skills point at runbook sections and only quote them word for word; tests/test_plugin.py checks each quote and runs the hook and the server exactly as the manifests say"
note = "the marketplace is .claude-plugin/marketplace.json at the root; the design is docs/evidence/plugin-design-2026-10-14.md (CE-77)"

[[routes]]
component = "Evidence"
path = "docs"
pattern = "evidence/<topic>-<date>.md"
mode = "ACTIVE-PLAN, then FROZEN"

[[routes]]
component = "Spike evidence"
path = "spike"
mode = "frozen per run"
note = "FINDINGS.md is the result; the probes show how"

[[routes]]
component = "Tests"
path = "tests"
mode = "replaced; criteria are claimed with `@pytest.mark.criterion(\"AC-n\")` (G-T2)"

[[routes]]
component = "CI"
path = ".github/workflows/gate.yml"
mode = "replaced; runs the gate on every push (CE-10); tests/test_ci.py keeps it in step with CLAUDE.md § Gate and pyproject.toml"

[[routes]]
component = "Tools"
path = "tools"
mode = "replaced; linux_gate.py runs CI's job on Linux before every push (CE-67)"
note = "sabotage_<task>.py are sabotage probes kept as evidence until G-T5 replaces them (CE-34)"

[[routes]]
component = "Scratch"
path = ".scratch"
mode = "throwaway and gitignored; anything only there is lost"
optional = true  # absent on a fresh clone

# The doc guards (FRAMEWORK §8.2, §8.3; G-D1's caps are on [[routes]] above). Each list names
# what its guard reads; `off` names guards lint does not report (none here).
[guards]
off = []
links = ["CLAUDE.md", "HANDOFF.md", "README.md", "docs/framework/FRAMEWORK.md", "docs/runbooks", "docs/charter.md", "docs/criteria.md", "src/context_engine/REGISTER.md", "src/context_engine/kit", "tasks"]  # G-D3; closed tasks are skipped (status: deprecated)
existence = ["docs/criteria.md", "src/context_engine/REGISTER.md"]  # G-T3: the normative docs (§11.2 "traps accumulate"); stories are owner words that cite other repos' files, so they are not listed
signals = ["CLAUDE.md", "HANDOFF.md", "docs/framework/FRAMEWORK.md", "docs/runbooks", "docs/charter.md", "docs/criteria.md"]  # G-D7
warn_max = 3       # G-D7; provenance: JUDGEMENT, engine default (the global contract keeps about this many per section); wrong if a real trap goes unmarked to stay under it
bold_caps_max = 5  # G-D7; provenance: JUDGEMENT, engine default; FRAMEWORK holds 3 on 2026-10-12d (its liveness words); wrong as above
retired_glyphs = []
coverage_spec = "docs/framework/FRAMEWORK.md"           # G-D12 (CE-30): every component, procedure and G-id it names is owned by the newest map or a board item
coverage_maps = "docs/evidence/framework-coverage-*.md"  # G-D12: the frozen, dated coverage maps (CE-16); the newest by file-name date is read
charter = "docs/charter.md"   # G-I1 (CE-25): its goal table's `G-n` rows are the goals a story's `goals` may name
stories = "story"             # G-I1, G-I2, G-T1, G-T6: the kind holding the stories
tests = ["tests"]             # G-T2: where tests claim criteria, as `@pytest.mark.criterion("AC-n")` (the default `claim` pattern)
liveness = ["CLAUDE.md", "HANDOFF.md", "README.md", "docs/charter.md", "docs/criteria.md", "docs/framework", "docs/ledger/session-log.md", "docs/runbooks", "src/context_engine/REGISTER.md", "src/context_engine/kit"]  # G-D4 (CE-33): every tracked doc that is not a record
history = ["docs/evidence", "spike"]  # G-D4: provenance directories, FROZEN (or ACTIVE-PLAN while the item is open)
liveness_lines = 10  # G-D4: the window; provenance: MEASURED 2026-10-13c, every declaration in this repo sits on line 3 or line 7 (docs/evidence/ce33-false-reds-2026-10-13.md), and the window the prior art measured is 10; wrong if the title block of a doc legitimately pushes its declaration further down
numbers = ["CLAUDE.md", "HANDOFF.md", "README.md", "docs/charter.md", "docs/criteria.md", "docs/framework/FRAMEWORK.md", "docs/runbooks", "src/context_engine/REGISTER.md", "src/context_engine/kit"]  # G-D5 (CE-33, §11.2 "the repo measures things"): the LIVING docs

# G-D4: the liveness of docs whose opening lines this repo may not edit, so they cannot carry the line
[guards.liveness_given]
"CLAUDE.md" = "LIVING"                                      # the contract: its top is the kit block in a fresh repo
"docs/framework/contract.md" = "LIVING"                     # the framework's, byte-equal to the kit's (G-D0)
"docs/framework/FRAMEWORK-v*.md" = "FROZEN"                 # frozen provenance: never edited; an archive opens with ARCHIVED <date> (§6.12)
"docs/charter.md" = "LIVING"                                # signed off by the owner: replaced only with the owner
"docs/ledger/session-log.md" = "LIVING"                     # written by the engine; append-only entries
"src/context_engine/kit/contract.md" = "LIVING"             # the framework contract itself (G-D0 compares against it)
"src/context_engine/kit/bootloader.md" = "LIVING"           # the CLAUDE.md block, compared by G-D0
"src/context_engine/kit/docs/ledger/session-log.md" = "LIVING"  # the engine's empty ledger, pinned by AC-30
