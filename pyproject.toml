[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-engine"
version = "0.5.0.dev0"
description = "Record engine for agent-built repos: OKF records, a per-session MCP server, housekeeping and lints"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",  # SDK 2.x: mcp.server.mcpserver.MCPServer (DEC-8)
    "ruamel.yaml>=0.18",
]

[project.scripts]
context-engine = "context_engine.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "setuptools>=68",  # the build-system requires: test_kit builds the wheel with --no-build-isolation (CE-10)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
context_engine = ["REGISTER.md", "kit/**/*"]  # the residual-risk register (FRAMEWORK §7.4) and the adoption kit `init` copies (§6.9), every subdirectory included, ship with it

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["criterion(id): the AC-n criterion in docs/criteria.md that this test claims"]
