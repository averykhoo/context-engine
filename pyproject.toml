[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-engine"
version = "0.0.1.dev0"
description = "Record engine for agent-built repos: OKF records, a per-session MCP server, housekeeping and lints"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "ruamel.yaml>=0.18",
]

[project.scripts]
context-engine = "context_engine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["criterion(id): the AC-n criterion in docs/criteria.md that this test claims"]
